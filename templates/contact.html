<header class="hero">
  <div class="wrap-narrow" style="text-align:center">
    <span class="eyebrow">FREE CONSULTATION · 免費諮詢</span>
    <h1 style="margin-top:14px">現在填表，<br>24 小時內回覆</h1>
    <div class="rule center"></div>
    <p class="hero-lead" style="margin-left:auto;margin-right:auto">告訴我們你的產業、目標與預算，我們會在 24 小時內主動與您聯繫，提供初步的廣告方向與評估。諮詢完全免費，不會有後續推銷。</p>
  </div>
</header>

<section class="section bg-cream">
  <div class="wrap-narrow">
    <form class="form" id="consultForm">
      <div class="form-row">
        <label>
          <span>姓名 / 稱呼 <em>*</em></span>
          <input name="name" required placeholder="您的姓名" autocomplete="name">
        </label>
        <label>
          <span>公司 / 品牌</span>
          <input name="company" placeholder="公司或品牌名稱" autocomplete="organization">
        </label>
      </div>
      <div class="form-row">
        <label>
          <span>聯絡方式 <em>*</em></span>
          <input name="contact" required placeholder="Email 或電話" autocomplete="email">
        </label>
        <label>
          <span>產業別</span>
          <select name="industry">
            {%- for i in site.form_industries %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
          </select>
        </label>
      </div>
      <label>
        <span>每月廣告預算</span>
        <select name="budget">
          {%- for b in site.form_budgets %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
        </select>
      </label>
      <label>
        <span>想達成的目標</span>
        <textarea name="goal" rows="4" placeholder="簡單描述你的產品、目前狀況與想達成的目標"></textarea>
      </label>
      <button type="submit">送出諮詢表單 →</button>
      <p class="form-note">送出後將以 Email 寄給我們，我們會在 24 小時內回覆。<br>你的資料僅用於本次諮詢聯繫，我們不會外流。詳見<a href="{{ site.root }}privacy/">隱私權政策</a>。</p>
    </form>

    <div style="display:flex;align-items:center;gap:16px;max-width:620px;margin:32px auto 0">
      <span style="flex:1;height:1px;background:var(--line)"></span>
      <span style="font-size:12px;color:var(--faint);white-space:nowrap">或直接透過</span>
      <span style="flex:1;height:1px;background:var(--line)"></span>
    </div>
    <div class="btns" style="justify-content:center;margin-top:20px">
      <a class="btn btn-line" href="{{ site.line }}" target="_blank" rel="noopener">加 LINE 諮詢 →</a>
      <a class="btn btn-ghost" href="mailto:{{ site.email }}">✉ Email 聯繫</a>
    </div>
    <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:20px;margin-top:24px">
      {%- for s in site.socials %}
      <a href="{{ s.href }}" target="_blank" rel="noopener" style="font-family:var(--latin);font-size:13px;color:var(--muted);font-weight:500;border-bottom:1px solid rgba(196,158,84,.5);padding-bottom:3px">{{ s.label }}</a>
      {%- endfor %}
    </div>
  </div>
</section>

<section class="section bg-cream-dark">
  <div class="wrap-narrow prose">
    {{ content }}
  </div>
</section>
