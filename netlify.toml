# Netlify 設定檔
# 放在專案根目錄，Netlify 會自動讀取。

[build]
  # 安裝套件並建置網站
  command = "pip install -r requirements.txt && python3 build.py"
  # 產出的資料夾
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"
  # 建置時的時區，讓排程文章用台灣時間判斷日期
  TZ = "Asia/Taipei"

# ── 快取設定 ────────────────────────────────
#
# ⚠ 不要把下面第一條改成 "/*.html"。
#
# 本站用的是美化網址（/thanks/、/pricing/、/blog/xxx/），
# 送到伺服器的請求路徑是「/thanks/」而不是「/thanks/index.html」，
# 所以 "/*.html" 這個樣式比對不到任何一個頁面，等於整條規則失效。
#
# 2026-10-15 就是因為這個寫法，CDN 快取了 /thanks/ 的 404 回應，
# 加上查詢字串（?cb=1）才繞得過去。排程文章上線時也會有同樣風險：
# 訪客或 Google 可能拿到舊版本。
#
# 預設全部不快取，再針對靜態資源個別放寬。
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# 樣式表內容穩定，可長期快取（改版時檔名不變，但有 ETag 驗證）
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 圖片等靜態資源
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
